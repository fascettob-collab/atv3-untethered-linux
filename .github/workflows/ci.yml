name: syntax-check

on:
  push:
    branches: [ "ci-syntax-checks" ]
  pull_request:
    branches: [ main ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax (all .sh)
        run: |
          set -e
          for f in $(find . -name '*.sh'); do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: Python tokenize (all .py, py2/py3 compatible)
        run: |
          set -e
          python3 - <<'PY'
          import tokenize, pathlib, sys
          bad = False
          for p in sorted(pathlib.Path('.').rglob('*.py')):
              try:
                  with p.open() as fh:
                      list(tokenize.generate_tokens(fh.readline))
                  print('OK', p)
              except Exception as e:
                  print('FAIL', p, e)
                  bad = True
          if bad:
              sys.exit(1)
          PY
